# Gate workflow for the Swap Intent XO template (Node + npm, package-lock.json). Manual dispatch only.
# No secrets and no network-dependent tests: chipnet runs happen outside CI; CI checks the template offline.
name: gerbang
on: workflow_dispatch
jobs:
  gerbang:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    env:
      NO_COLOR: "1"
      CI: "1"
      TERM: dumb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: bash scripts/gerbang-ujian.sh
